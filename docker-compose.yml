version: '3.9'

services:
  # ── PostgreSQL ──────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: eclat_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       eclat_db
      POSTGRES_USER:     eclat_user
      POSTGRES_PASSWORD: eclat_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eclat_user -d eclat_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── FastAPI Backend ─────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eclat_backend
    restart: unless-stopped
    environment:
      DATABASE_URL:    postgresql://eclat_user:eclat_pass@postgres:5432/eclat_db
      GEMINI_API_KEY:  ${GEMINI_API_KEY:-}
      PINECONE_API_KEY:${PINECONE_API_KEY:-}
      PINECONE_INDEX:  ${PINECONE_INDEX:-eclat-jewellery}
      ALLOWED_ORIGINS: http://localhost:3000
      ADMIN_API_KEY:   eclat-dev-key
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ── Next.js Frontend ────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eclat_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL:         http://localhost:8000
      NEXT_PUBLIC_MOCK_FALLBACK:   "false"
      NEXT_PUBLIC_GEMINI_API_KEY:  ${NEXT_PUBLIC_GEMINI_API_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
